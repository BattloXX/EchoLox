name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release.cfg'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Create as prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        run: |
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            NEXT="0.1.0"
          else
            V="${LATEST#v}"
            MAJOR=$(echo "$V" | cut -d. -f1)
            MINOR=$(echo "$V" | cut -d. -f2)
            PATCH=$(echo "$V" | cut -d. -f3)
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next release: $NEXT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build binaries
        run: |
          go mod tidy
          V="${{ steps.ver.outputs.version }}"
          GOOS=linux GOARCH=arm64       go build -ldflags="-s -w -X main.version=$V" -o bin/EchoLox-arm64 ./cmd/EchoLox
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.version=$V" -o bin/EchoLox-armv7 ./cmd/EchoLox
          GOOS=linux GOARCH=amd64       go build -ldflags="-s -w -X main.version=$V" -o bin/EchoLox-amd64  ./cmd/EchoLox

      - name: Stamp version into plugin.cfg and Makefile
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/^VERSION = .*/VERSION = $V/" plugin.cfg
          sed -i "s/^VERSION=.*/VERSION=$V/" Makefile

      - name: Build ZIP
        run: |
          zip -r "EchoLox-${{ steps.ver.outputs.version }}.zip" * \
            -x "*.git*" -x "bin/EchoLox" -x "*.zip" -x "*.tmp" -x "go.sum" -x "generated-image.png"

      - name: Create release
        run: |
          V="${{ steps.ver.outputs.version }}"
          COMMIT_MSG=$(git log -1 --pretty='%s')
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease || 'false' }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v$V" \
            --title "EchoLox v$V" \
            --notes "$(printf 'Automatischer Build von \`main\`\n\n**Commit:** %s' "$COMMIT_MSG")" \
            $PRERELEASE_FLAG \
            "EchoLox-$V.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release.cfg for LoxBerry autoupdate
        run: |
          V="${{ steps.ver.outputs.version }}"
          REPO="${{ github.repository }}"
          {
            echo "[AUTOUPDATE]"
            echo "VERSION = $V"
            echo "ARCHIVEURL = https://github.com/$REPO/releases/download/v$V/EchoLox-$V.zip"
            echo "INFOURL = https://github.com/$REPO/releases/tag/v$V"
          } > release.cfg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.cfg
          git diff --staged --quiet || git commit -m "chore: update release.cfg to v$V [skip ci]"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
