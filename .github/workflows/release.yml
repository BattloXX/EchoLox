name: Release ZIP

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release.cfg'
      - 'prerelease.cfg'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Create as prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from plugin.cfg
        id: ver
        run: |
          V=$(grep -E '^VERSION = ' plugin.cfg | head -1 | sed 's/VERSION = //')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Verify locally compiled binaries are present
        run: |
          test -x bin/EchoLox-arm64 || { echo "::error::bin/EchoLox-arm64 fehlt — lokal builden (make all) und committen"; exit 1; }
          test -x bin/EchoLox-armv7  || { echo "::error::bin/EchoLox-armv7 fehlt — lokal builden (make all) und committen"; exit 1; }
          test -x bin/EchoLox-amd64  || { echo "::error::bin/EchoLox-amd64 fehlt — lokal builden (make all) und committen"; exit 1; }

      - name: Skip if release already exists
        id: check
        run: |
          V="${{ steps.ver.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$V existiert bereits — wird uebersprungen"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ZIP
        if: steps.check.outputs.exists == 'false'
        run: |
          zip -r "EchoLox-${{ steps.ver.outputs.version }}.zip" * \
            -x "*.git*" -x "bin/EchoLox" -x "*.zip" -x "*.tmp" -x "go.sum" -x "generated-image.png"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          COMMIT_MSG=$(git log -1 --pretty='%s')
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease || 'false' }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v$V" \
            --title "EchoLox v$V" \
            --notes "$(printf 'Build aus lokal kompilierten Bins\n\n**Commit:** %s' "$COMMIT_MSG")" \
            $PRERELEASE_FLAG \
            "EchoLox-$V.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release.cfg and prerelease.cfg for LoxBerry autoupdate
        if: steps.check.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          REPO="${{ github.repository }}"
          {
            echo "[AUTOUPDATE]"
            echo "VERSION = $V"
            echo "ARCHIVEURL = https://github.com/$REPO/releases/download/v$V/EchoLox-$V.zip"
            echo "INFOURL = https://github.com/$REPO/releases/tag/v$V"
          } > release.cfg
          if [ "${{ inputs.prerelease || 'false' }}" = "true" ]; then
            cp release.cfg prerelease.cfg
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.cfg prerelease.cfg
          git diff --staged --quiet || git commit -m "chore: update release.cfg to v$V [skip ci]"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
