<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoLox – Status</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="navbar">
  <span class="brand">EchoLox</span>
  <button class="nav-toggle" onclick="toggleNav()" aria-label="Menü">&#9776;</button>
  <div class="nav-links" id="navLinks">
    <a href="index.html">Geräte</a>
    <a href="status.html">Status</a>
    <a href="settings.html">Einstellungen</a>
    <a href="backup.html">Backup</a>
    <a href="logs.html">Logs</a>
    <a href="import.html">Import</a>
    <a href="discover.html">Discovery</a>
    <a href="about.html">About</a>
  </div>
</nav>
<div class="container">
  <div class="header-row">
    <h1>Virtual Input Status</h1>
    <button onclick="refreshStatus()" class="btn">Refresh</button>
  </div>
  <div class="filter-row">
    <button onclick="filterStatus('all')" class="btn active" id="f-all">Alle</button>
    <button onclick="filterStatus('ok')" class="btn" id="f-ok">OK</button>
    <button onclick="filterStatus('not_found')" class="btn" id="f-nf">Not Found</button>
    <button onclick="filterStatus('not_sent')" class="btn" id="f-ns">Not Sent</button>
    <input type="text" id="searchInput" placeholder="Suche..." oninput="filterStatus(currentFilter)">
  </div>
  <table>
    <thead>
      <tr>
        <th class="sortable" id="sth-status" onclick="sortStatusBy('status')">Status <span class="sort-icon" id="ssort-status"></span></th>
        <th class="sortable" id="sth-name" onclick="sortStatusBy('name')">Virtual Input Name <span class="sort-icon" id="ssort-name"></span></th>
        <th class="sortable" id="sth-device" onclick="sortStatusBy('device_name')">Gerät <span class="sort-icon" id="ssort-device"></span></th>
        <th class="sortable" id="sth-value" onclick="sortStatusBy('last_value')">Letzter Wert <span class="sort-icon" id="ssort-value"></span></th>
        <th class="sortable" id="sth-sent" onclick="sortStatusBy('last_sent')">Zuletzt gesendet <span class="sort-icon" id="ssort-sent"></span></th>
      </tr>
    </thead>
    <tbody id="statusBody"></tbody>
  </table>
</div>
<script src="assets/app.js"></script>
<script>loadStatus();</script>
</body>
</html>
