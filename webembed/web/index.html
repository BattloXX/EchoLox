<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoLox – Geräte</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="navbar">
  <span class="brand">EchoLox</span>
  <button class="nav-toggle" onclick="toggleNav()" aria-label="Menü">&#9776;</button>
  <div class="nav-links" id="navLinks">
    <a href="index.html">Geräte</a>
    <a href="status.html">Status</a>
    <a href="settings.html">Einstellungen</a>
    <a href="backup.html">Backup</a>
    <a href="logs.html">Logs</a>
    <a href="import.html">Import</a>
    <a href="discover.html">Discovery</a>
    <a href="about.html">About</a>
  </div>
</nav>
<div class="container">
  <div class="header-row">
    <h1>Geräte</h1>
    <a href="device.html" class="btn btn-primary">+ Neu</a>
  </div>
  <div class="filter-row">
    <input type="text" id="deviceSearch" placeholder="Suche nach Name, Typ, Transport, Virtual Input…" oninput="renderDevices()" style="margin-left:0;flex:1;max-width:400px">
  </div>
  <table id="deviceTable">
    <thead>
      <tr>
        <th class="sortable" id="dth-name" onclick="sortDevices('name')">Name <span class="sort-icon" id="dsort-name"></span></th>
        <th class="sortable" id="dth-type" onclick="sortDevices('type')">Typ <span class="sort-icon" id="dsort-type"></span></th>
        <th class="sortable" id="dth-mode" onclick="sortDevices('switch_mode')">Modus <span class="sort-icon" id="dsort-mode"></span></th>
        <th class="sortable" id="dth-transport" onclick="sortDevices('transport')">Transport <span class="sort-icon" id="dsort-transport"></span></th>
        <th>Virtual Inputs</th>
        <th>Aktionen</th>
      </tr>
    </thead>
    <tbody id="deviceBody"></tbody>
  </table>
</div>
<script src="assets/app.js"></script>
<script>loadDevices();</script>
</body>
</html>
